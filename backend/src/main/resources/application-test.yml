spring:
  datasource:
    url: jdbc:h2:mem:homefix_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

app:
  jwt:
    secret: HomeFixAiTestSecretKeyForTestingPurposeOnlyAtLeast32BytesLength!
    expiration-ms: 3600000
  upload:
    dir: target/test-uploads
    allowed-types: image/jpeg,image/png,image/webp
    max-file-size-bytes: 10485760
  gemini:
    api-key: ""
    model: gemini-1.5-flash
