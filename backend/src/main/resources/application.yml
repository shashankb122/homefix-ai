server:
  port: ${PORT:8080}

spring:
  application:
    name: homefix-ai-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix_ai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

app:
  jwt:
    # Must be at least 256 bits (32+ chars) for HS256 / HS384 / HS512
    secret: ${JWT_SECRET:HomeFixAiSuperSecureJwtSecretKeyMustBe32BytesLongForSecurity2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  upload:
    dir: ${UPLOAD_DIR:uploads}
    allowed-types: image/jpeg,image/png,image/webp
    max-file-size-bytes: 10485760 # 10MB
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    endpoint: https://generativelanguage.googleapis.com/v1beta/models

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
